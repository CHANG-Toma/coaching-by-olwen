version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coaching-by-olwen-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: coaching_user
      POSTGRES_PASSWORD: coaching_password
      POSTGRES_DB: coaching_by_olwen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer pour gérer la base de données via interface web
  adminer:
    image: adminer:latest
    container_name: coaching-by-olwen-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data_dev:
